<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="site-nav" aria-label="Navigasi utama">
        <a href="index.html">Home</a>
        <a href="contact.html" class="active" aria-current="page">Contact</a>
        <a href="about_me.html">About Me</a>
    </nav>
    <main class="biodata-container page-content">
        <h1>Contact me</h1>
        <p class="contact-intro">Silakan kirim pesan melalui Gmail atau hubungi saya melalui WhatsApp.</p>
        <form class="contact-form" id="contact-form">
            <label for="sender-name">Nama</label>
            <input type="text" id="sender-name" name="name" placeholder="Masukkan nama Anda" required>
            <label for="sender-email">Email</label>
            <input type="email" id="sender-email" name="email" placeholder="nama@email.com" required>
            <label for="message">Pesan</label>
            <textarea id="message" name="message" rows="6" placeholder="Tuliskan pesan Anda..." required></textarea>
            <button type="submit">Kirim melalui Gmail</button>
        </form>
        <div class="whatsapp-contact">
            <h2>Contact WhatsApp</h2>
            <p><a href="https://wa.me/6285179885760" target="_blank" rel="noopener noreferrer">0851-7988-5760</a></p>
        </div>
    </main>
    <script>
        document.getElementById('contact-form').addEventListener('submit', function (event) {
            event.preventDefault();
            const name = document.getElementById('sender-name').value;
            const email = document.getElementById('sender-email').value;
            const message = document.getElementById('message').value;
            const subject = `Pesan website dari ${name}`;
            const body = `Nama: ${name}\nEmail: ${email}\n\nPesan:\n${message}`;
            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=muhammaddfikri432@gmail.com&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.open(gmailUrl, '_blank', 'noopener,noreferrer');
        });
    </script>
</body>
</html>
